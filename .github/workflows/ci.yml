name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Build the policy index
        run: python -m rag build
      - name: Run automated tests
        run: pytest
      - name: Run gold evaluation and ablation
        run: python -m evaluation.runner
      - name: Upload evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ github.sha }}
          path: |
            evaluation/report.json
            evaluation/ablation.json
          retention-days: 30

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      DEPLOYED_APP_URL: ${{ secrets.DEPLOYED_APP_URL }}
    steps:
      - name: Require deployment configuration
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || {
            echo "::error::RENDER_DEPLOY_HOOK_URL is not configured"
            exit 1
          }
          test -n "$DEPLOYED_APP_URL" || {
            echo "::error::DEPLOYED_APP_URL is not configured"
            exit 1
          }
      - name: Trigger gated Render deployment
        run: curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Wait for the deployed UI health check
        run: |
          for attempt in {1..40}; do
            if curl --fail --show-error --silent \
              "${DEPLOYED_APP_URL%/}/_stcore/health"; then
              exit 0
            fi
            echo "Waiting for deployment ($attempt/40)"
            sleep 15
          done
          echo "::error::Deployment did not become healthy within 10 minutes"
          exit 1
