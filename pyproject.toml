[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ragstoriches"
version = "0.1.0"
description = "An agentic RAG assistant for synthetic HR workflows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.117.1",
    "httpx==0.28.1",
    "mcp==1.26.0",
    "pydantic-settings==2.10.1",
    "sse-starlette==2.4.1",
    "starlette==0.48.0",
    "streamlit==1.50.0",
    "uvicorn[standard]==0.37.0",
]

[project.scripts]
rag-policy = "rag.__main__:main"
rag-evaluate = "evaluation.runner:main"

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*", "hr_mcp*", "rag*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
